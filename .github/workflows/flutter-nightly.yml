name: Flutter Nightly Build

on:
  schedule:
    # schedule build every night
    - cron: "0 0 * * *"
  workflow_dispatch:

# LAN60: caller must grant write so called flutter-build.yml jobs (generate-sbom
# creating a release) can run; fork default GITHUB_TOKEN is read-only.
permissions:
  contents: write
  packages: write

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
